name: post
on:
  schedule:
    - cron: "15 16 * * *"         # 16:15 UTC = 9:45 PM IST
  workflow_dispatch:
concurrency:
  group: lifelog
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python post.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      - name: Save log
        if: always()
        run: |
          git config user.name "lifelog-bot"
          git config user.email "lifelog-bot@users.noreply.github.com"
          git add data/log.json || exit 0
          git diff --cached --quiet || (git commit -m "posted" && git push)
