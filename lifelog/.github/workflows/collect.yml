name: collect
on:
  schedule:
    - cron: "37 */2 * * *"        # every 2 hours
  workflow_dispatch:
concurrency:
  group: lifelog
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python collect.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save log
        if: always()
        run: |
          git config user.name "lifelog-bot"
          git config user.email "lifelog-bot@users.noreply.github.com"
          git add data/log.json || exit 0
          git diff --cached --quiet || (git commit -m "log" && git push)
